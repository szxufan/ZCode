packages:
  - apps/dev-docs
  - packages/*
  - apps/zcode-cli
  - apps/zcode-cli/packages/*
  - apps/zcode-cli/tools/*
  - relay-server
# pnpm 11 起不再读取 package.json 的 pnpm.overrides / pnpm.patchedDependencies；
# 统一放在 workspace 根配置，pnpm 10 也从这里读取。nodeLinker 同样以本文件为准。
nodeLinker: hoisted
overrides:
  "@electron/rebuild>node-abi": 4.37.0
  electron-to-chromium: 1.5.452
  react: 19.2.7
  react-dom: 19.2.7
patchedDependencies:
  "@radix-ui/react-collapsible@1.1.12": patches/@radix-ui__react-collapsible@1.1.12.patch
  vitest@4.1.7: patches/vitest@4.1.7.patch
  wdio-electron-service@9.2.1: patches/wdio-electron-service@9.2.1.patch
  "@arms/rum-electron@0.0.3": patches/@arms__rum-electron@0.0.3.patch
  "@ai-sdk/openai-compatible@2.0.60": patches/@ai-sdk__openai-compatible@2.0.60.patch
  "@ai-sdk/anthropic@3.0.81": patches/@ai-sdk__anthropic@3.0.81.patch
  "@aiden0z/pptx-renderer@1.2.4": patches/@aiden0z__pptx-renderer@1.2.4.patch
  "@extend-ai/react-xlsx@0.16.0": patches/@extend-ai__react-xlsx@0.16.0.patch
  "@radix-ui/react-menu@2.1.16": patches/@radix-ui__react-menu@2.1.16.patch
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
